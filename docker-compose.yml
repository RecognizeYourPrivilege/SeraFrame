services:
  seraframe:
    build: .
    ports:
      - "8081:8081"
    environment:
      SERAFRAME_ADMIN_PASSWORD: ${SERAFRAME_ADMIN_PASSWORD:?set SERAFRAME_ADMIN_PASSWORD}
      # Optional. Empty or unset: generate and reuse /data/secret_key.
      # Set: use this value and leave /data/secret_key unchanged.
      SERAFRAME_SECRET_KEY: ${SERAFRAME_SECRET_KEY:-}
      SERAFRAME_DATA_DIR: /data
      SERAFRAME_PORT: "8081"
      SERAFRAME_TRUST_PROXY: ${SERAFRAME_TRUST_PROXY:-0}
    volumes:
      - seraframe-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  seraframe-data:
